<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#060608" />
  <rect x="2" y="2" width="96" height="96" rx="20" fill="none" stroke="url(#orangeGrad)" stroke-width="2.5" stroke-opacity="0.4" />
  
  <!-- Left and right connecting struts -->
  <line x1="38" y1="58" x2="25" y2="70" stroke="url(#orangeGrad)" stroke-width="7" stroke-linecap="round" />
  <line x1="62" y1="58" x2="75" y2="70" stroke="url(#orangeGrad)" stroke-width="7" stroke-linecap="round" />

  <!-- Left & right satellite nodes -->
  <circle cx="23" cy="71" r="10" fill="url(#orangeGrad)" />
  <circle cx="77" cy="71" r="10" fill="url(#orangeGrad)" />

  <!-- Center receptor hub -->
  <path
    d="M39 37.5 C34 42 32.5 49 34 56 C36 63 42.5 68 50 68 C57.5 68 64 63 66 56 C67.5 49 66 42 61 37.5"
    stroke="url(#orangeGrad)"
    stroke-width="7"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Center transmitter key and pin -->
  <circle cx="50" cy="20" r="8" fill="#FFFFFF" />
  <path d="M50 20 V46" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" />
  <circle cx="50" cy="46" r="4.5" fill="#FFFFFF" />
</svg>